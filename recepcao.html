<style>
  :root{
    color-scheme: light;
    --page:#eeeeee; --surface:#ffffff; --text:#212121; --text2:#5f5f5f; --muted:#9e9e9e;
    --grid:#e0e0e0; --border:rgba(0,0,0,.12);
    --accent:#c0c642; --accent-ink:#5d6300; --good:#0ca30c; --warn:#b5790a; --bad:#d03b3b;
    --shadow:0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --page:#141414; --surface:#1e1c1a; --text:#f0ede7; --text2:#c7c2ba; --muted:#9a948b;
      --grid:#2c2925; --border:rgba(255,255,255,.14);
      --accent:#c0c642; --accent-ink:#dfe48a; --good:#23c723; --warn:#e0a83a; --bad:#f0605f;
      --shadow:0 2px 1px -1px rgba(0,0,0,.5),0 1px 1px 0 rgba(0,0,0,.4),0 1px 3px 0 rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}

  #tela-login{position:fixed;inset:0;background:var(--page);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .login-card{width:100%;max-width:340px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:26px 22px}
  .login-card .login-logo{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%}
  .login-card h1{font-size:19px;margin:0 0 4px;text-align:center}
  .login-card .sub{font-size:12.5px;color:var(--text2);margin-bottom:18px;text-align:center}
  .login-card label{display:block;font-size:12px;color:var(--text2);margin:12px 0 4px}
  .login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--page);color:var(--text);font:inherit;font-size:15px}
  .login-card button{width:100%;margin-top:18px;background:var(--accent);color:#0b0b0b;border:0;padding:11px;border-radius:10px;font:inherit;font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;box-shadow:var(--shadow)}
  .login-card button:disabled{opacity:.6}
  .login-card .aviso{font-size:12.5px;color:var(--muted);margin-top:12px;min-height:16px}

  .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .brand{display:flex;flex-direction:column;line-height:1.25}
  .brand-t{font-weight:700;letter-spacing:.04em;color:var(--accent-ink);font-size:15px}
  .brand-s{font-size:11.5px;color:var(--text2)}
  .brand-logo{height:34px;width:auto;display:block}
  .btn-ghost{background:none;border:1px solid var(--border);border-radius:10px;padding:7px 12px;font:inherit;font-size:12px;color:var(--text2);cursor:pointer}

  .maintabs{display:flex;background:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
  .mtab{flex:1;background:none;border:0;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:500;color:var(--text2);border-radius:7px;cursor:pointer}
  .mtab.active{background:var(--accent);color:#0b0b0b}

  .area{display:none}
  .area.active{display:block}

  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .seg{display:flex;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:3px;gap:2px}
  .segbtn{background:none;border:0;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:500;color:var(--text2);border-radius:7px;cursor:pointer;white-space:nowrap}
  .segbtn.active{background:var(--accent);color:#0b0b0b}
  .mesbar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
  .mesbar select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px}

  .card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .card h3{margin:0 0 4px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .cardsub{font-size:12px;color:var(--muted);margin-bottom:10px}
  .cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .cardhead h3{margin:0}

  .setor{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}

  .subcard{background:var(--page);border-radius:10px;padding:8px 10px;margin-bottom:10px}
  .subcard:last-child{margin-bottom:0}
  .subcard-h{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;padding:0 4px}
  .setor:first-child{margin-top:0}

  .pac-bloco{border-top:1px solid var(--grid);padding:10px 0}
  .pac-bloco:first-of-type{border-top:0}
  .pac-bloco.inativo{opacity:.5}

  .dias-linha{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .dia-bloco{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:8px 10px;min-width:150px}
  .dia-bloco-h{font-weight:700;font-size:12.5px;margin-bottom:6px}
  .dia-linha{font-size:12.5px;line-height:1.9;white-space:nowrap}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:4px 0;flex-wrap:wrap}
  .rowtxt{font-size:13.5px;line-height:1.45}
  .rowsub{font-size:12px;color:var(--text2);margin:2px 0 4px}
  .item-rowtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .item-nome-linha{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .muted{color:var(--muted)}
  .acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}

  .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--page);color:var(--text2);border:1px solid var(--grid);white-space:nowrap}
  .tag.ok{background:color-mix(in srgb, var(--good) 15%, transparent);color:var(--good);border-color:transparent}
  .tag.off{background:color-mix(in srgb, var(--bad) 15%, transparent);color:var(--bad);border-color:transparent}
  .tag.warn{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn);border-color:transparent}

  .icon-link{background:none;border:0;cursor:pointer;font-size:13px;padding:1px 3px;line-height:1;margin-right:1px;text-decoration:none;display:inline-block}

  .mini{background:none;border:1px solid var(--border);color:var(--text2);font:inherit;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .mini.danger{color:var(--bad);border-color:transparent}
  .mini.wa{background:#25D366;color:#fff;border-color:transparent;font-weight:500}
  .mini-chk{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
  .mini-sel{font:inherit;font-size:11.5px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}

  .subform{margin-top:10px;padding:12px 14px;border:1px solid var(--grid);border-radius:10px;background:var(--page)}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
  .inp, .subform input[type=text], .subform input[type=date], .subform input[type=time],
  .subform input[type=tel], .subform select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--text);font:inherit;font-size:14px;
  }
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
  .chk input{width:16px;height:16px}
  .search{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px}

  .btn{background:var(--accent);color:#0b0b0b;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{opacity:.6}
  .btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:12.5px;cursor:pointer}
  .btn-outline.danger{color:var(--bad)}
  .msg{font-size:12px;color:var(--muted);margin-left:10px}
  .aviso{background:#fff3e6;border:1px solid var(--warn);color:#7a3d00;border-radius:8px;padding:10px 12px;font-size:12.5px;margin:8px 0;line-height:1.5}
  @media (prefers-color-scheme: dark){ .aviso{background:#3a2200;color:#ffce9e} }
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  @media (max-width:480px){
    .row{flex-direction:column}
    .acoes{width:100%}
  }

  /* Tela de PC: aproveita a largura em vez de ficar uma coluna estreita centralizada */
  @media (min-width:900px){
    .wrap{max-width:1180px}
    #area-nutri.active{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
    #area-nutri > .toolbar{grid-column:1 / -1}
    #area-visit.active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    #area-visit > .toolbar{grid-column:1 / -1}
    #card-validade{display:grid;grid-template-columns:2fr 3fr;gap:16px;align-items:start}
    #card-validade > .card:first-child{grid-column:1 / -1}
  }
</style>
</head><body>

function normaliza(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function digits(s){ return String(s||'').replace(/\D/g,''); }
function todayISO(){ var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function hojeYM(){ return todayISO().slice(0,7); }
function fmtDataBR(iso){ var p = String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtDataHora(iso, hora){ var s = fmtDataBR(iso); if (hora) s += ' às ' + String(hora).slice(0,5); return s; }
var MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(ym){ var p = ym.split('-'); return MESES_PT[parseInt(p[1],10)-1] + '/' + p[0]; }
var TIPOS = [['plano1','Plano 1'],['plano2','Plano 2'],['consulta1','Consulta 1'],['consulta2','Consulta 2'],['outros','Outros']];
var TIPOS_REPASSE = ['plano1','consulta1'];   // mês em que a academia repassa ao nutricionista
var TIPOS_RETORNO = ['plano2','consulta2'];   // retorno do paciente — sem repasse
function tipoLabel(t){ var m = TIPOS.filter(function(x){ return x[0]===t; })[0]; return m ? m[1] : (t || '—'); }
function proximoTipo(t){
  if (t === 'plano1') return 'plano2';
  if (t === 'plano2') return 'plano1';
  if (t === 'consulta1') return 'consulta2';
  if (t === 'consulta2') return 'consulta1';
  return null;
}

function waLink(phoneRaw, msg){
  var d = digits(phoneRaw);
  if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}
function msgExperimental(nome){
  var primeiro = String(nome||'').trim().split(/\s+/)[0] || '';
  return 'Oi ' + primeiro + '! Aqui é da AD3 Fit 💪 Passando pra saber o que você achou da sua aula experimental — foi tudo certinho? Vai ficar muito bem-vindo(a) entre a gente! Quer saber como fica pra se tornar aluno(a)?';
}
var DIAS_SEMANA_MSG = [
  {n:'domingo', prox:'próximo'},
  {n:'segunda-feira', prox:'próxima'},
  {n:'terça-feira', prox:'próxima'},
  {n:'quarta-feira', prox:'próxima'},
  {n:'quinta-feira', prox:'próxima'},
  {n:'sexta-feira', prox:'próxima'},
  {n:'sábado', prox:'próximo'}
];
function msgConfirmacaoNutri(paciente, ag, nutriNome){
  var primeiro = String(paciente.nome || '').trim().split(/\s+/)[0] || '';
  var dt = new Date(String(ag.data).slice(0,10) + 'T00:00:00');
  var diaInfo = DIAS_SEMANA_MSG[dt.getDay()];
  var dataFmt = fmtDataBR(ag.data).slice(0,5);
  var horaFmt = ag.hora ? String(ag.hora).slice(0,5) : '';
  return 'Oi ' + primeiro + ', tudo bem? Aqui é da AD3 Fit\n'
    + 'Estamos passando pra confirmar sua consulta com ' + nutriNome + '\n'
    + 'na ' + diaInfo.prox + ' ' + diaInfo.n + ', dia ' + dataFmt + (horaFmt ? ' às ' + horaFmt : '') + '.\n'
    + 'Te esperamos aqui.\n'
    + 'Qualquer imprevisto, avisa a gente.';
}
function msgConvidado(nome, alunoNome){
  var primeiro = String(nome||'').trim().split(/\s+/)[0] || '';
  var alunoPrimeiro = String(alunoNome||'').trim().split(/\s+/)[0] || 'nosso aluno';
  return 'Oi ' + primeiro + '! Aqui é da AD3 Fit 💪 Que bom ter você aqui como convidado(a) do(a) ' + alunoPrimeiro + '! O que achou do treino? Bora conhecer nossos planos e treinar com a gente? 😊';
}

function popularMeses(sel, atual, onChange){
  var hoje = new Date();
  var opts = [];
  for (var i = -6; i <= 1; i++){
    var d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
    opts.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  sel.innerHTML = opts.map(function(ym){ return '<option value="'+ym+'"'+(ym===atual?' selected':'')+'>'+mesLabel(ym)+'</option>'; }).join('');
  sel.addEventListener('change', function(){ onChange(sel.value); });
}

/* ---------------- VALIDADE (espelha a aba "Validade" da Gestão) ---------------- */
var PRODUTOS = [], LOTES = [];
async function carregarValidade(){
  var rp = await sb.from('produtos').select('*');
  PRODUTOS = (rp.data || []).map(function(p){ return { id: p.id, nome: p.nome, diasConsumo: p.dias_consumo }; });
  var rl = await sb.from('lotes').select('*').order('validade');
  LOTES = (rl.data || []).map(function(l){ return { id: l.id, produtoId: l.produto_id, validade: l.validade, quantidade: l.quantidade, data: l.data }; });
}
function produtoDe(id){ return PRODUTOS.filter(function(p){ return p.id === id; })[0] || { nome: '(produto removido)', diasConsumo: 30 }; }
function diasEntre(a, b){ return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function maskDataBR(v){
  v = (v || '').replace(/\D/g, '').slice(0, 8);
  var out = v.slice(0, 2);
  if (v.length > 2) out += '/' + v.slice(2, 4);
  if (v.length > 4) out += '/' + v.slice(4, 8);
  return out;
}
function parseDataBR(str){
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str || '');
  if (!m) return null;
  var dd = +m[1], mm = +m[2], yyyy = +m[3];
  if (mm < 1 || mm > 12) return null;
  var fev = (yyyy % 4 === 0 && (yyyy % 100 !== 0 || yyyy % 400 === 0)) ? 29 : 28;
  var diasMes = [31, fev, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (dd < 1 || dd > diasMes[mm - 1]) return null;
  return yyyy + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
}
function lotesOrdenados(){
  var hoje = todayISO();
  return LOTES.map(function(lo){
    var p = produtoDe(lo.produtoId);
    var ate = diasEntre(hoje, lo.validade);
    var vend = ate - (p.diasConsumo || 30);
    return { lote: lo, prod: p, ate: ate, vend: vend };
  }).sort(function(a, b){ return a.vend - b.vend; });
}
function renderValidade(){
  var box = document.getElementById('card-validade');
  if (!box) return;
  var linhas = lotesOrdenados();
  var agir = linhas.filter(function(l){ return l.vend <= 30 && l.vend > 0; }).length;
  var fora = linhas.filter(function(l){ return l.vend <= 0; }).length;

  var h = '<div class="card"><div class="cardhead"><h3>Validade — controle de estoque</h3>'
    + '<span class="acoes"><span class="tag warn">' + agir + ' em alerta</span><span class="tag off">' + fora + ' fora de venda</span></span></div>'
    + '<div class="cardsub">Espelhado da aba "Validade" da Gestão — o mesmo estoque, editável dos dois lados.</div></div>';

  h += '<div class="card"><h3>Lançar compra</h3>';
  h += '<div class="cardsub">Cada compra é um lote. O mesmo produto com validades diferentes entra em linhas separadas.</div>';
  h += '<div class="field"><label>Produto</label><input class="inp" id="vl-nome" list="vl-lista" placeholder="Nome do produto"></div>';
  h += '<datalist id="vl-lista">' + PRODUTOS.map(function(p){ return '<option value="' + escAttr(p.nome) + '">'; }).join('') + '</datalist>';
  h += '<div class="field"><label>Quantidade</label><input class="inp" id="vl-qtd" type="text" inputmode="numeric" pattern="[0-9]*" value="1" style="max-width:80px"></div>';
  h += '<div class="field"><label>Validade</label><input class="inp" id="vl-validade" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" style="max-width:140px"></div>';
  h += '<div class="acoes"><button class="btn" id="vl-add">Lançar lote</button><span class="msg" id="vl-msg"></span></div>';
  h += '<div class="cardsub">Suplemento consumido em 30 dias: um pote que vence em 40 dias tem só 10 dias de venda.</div>';
  h += '</div>';

  h += '<div class="card"><h3>Estoque por urgência</h3>';
  if (!linhas.length){
    h += '<div class="vazio">Nenhum lote lançado ainda.</div>';
  } else {
    linhas.forEach(function(l){
      var cls = 'tag', txt;
      if (l.vend <= 0){ cls += ' off'; txt = 'fora de venda'; }
      else if (l.vend <= 30){ cls += ' warn'; txt = l.vend + ' dias p/ vender'; }
      else { cls += ' ok'; txt = l.vend + ' dias p/ vender'; }
      h += '<div class="row"><span class="rowtxt item-rowtxt">'
         + '<span class="item-nome-linha" title="' + escAttr(l.prod.nome) + '"><b>' + esc(truncar(l.prod.nome, 26)) + '</b> · ' + (l.lote.quantidade || 1) + ' un</span>'
         + '<span class="muted">vence em ' + fmtDataBR(l.lote.validade) + ' · ' + l.ate + ' dias</span></span>'
         + '<span class="acoes"><span class="' + cls + '">' + txt + '</span><button class="mini" data-baixa="' + l.lote.id + '">dar baixa</button></span></div>';
    });
  }
  h += '</div>';
  box.innerHTML = h;
}
document.getElementById('card-validade').addEventListener('click', async function(e){
  var t = e.target;
  if (t.id === 'vl-add'){
    var nome = (document.getElementById('vl-nome').value || '').trim();
    var qtd = parseInt(document.getElementById('vl-qtd').value, 10) || 1;
    var val = parseDataBR(document.getElementById('vl-validade').value);
    var msgEl = document.getElementById('vl-msg');
    if (!nome){ msgEl.textContent = 'Falta o nome do produto.'; return; }
    if (!val){ msgEl.textContent = 'Data inválida — use o formato DD/MM/AAAA.'; return; }
    msgEl.textContent = '';
    t.disabled = true;
    var p = PRODUTOS.filter(function(x){ return x.nome.toLowerCase() === nome.toLowerCase(); })[0];
    if (!p){
      var resP = await sb.from('produtos').insert({ id: uid(), nome: nome, dias_consumo: 30 }).select().single();
      if (resP.error){ msgEl.textContent = 'Não consegui salvar o produto — tenta de novo.'; t.disabled = false; return; }
      p = { id: resP.data.id, nome: resP.data.nome, diasConsumo: resP.data.dias_consumo };
      PRODUTOS.push(p);
    }
    var novoLote = { id: uid(), produto_id: p.id, validade: val, quantidade: qtd, data: todayISO() };
    var resL = await sb.from('lotes').insert(novoLote).select().single();
    t.disabled = false;
    if (resL.error){ msgEl.textContent = 'Não consegui salvar o lote — tenta de novo.'; return; }
    LOTES.push({ id: resL.data.id, produtoId: resL.data.produto_id, validade: resL.data.validade, quantidade: resL.data.quantidade, data: resL.data.data });
    renderValidade();
    return;
  }
  var b = t.getAttribute && t.getAttribute('data-baixa');
  if (b){
    if (!confirm('Dar baixa nesse lote?')) return;
    await sb.from('lotes').delete().eq('id', b);
    LOTES = LOTES.filter(function(l){ return l.id !== b; });
    renderValidade();
  }
});
document.getElementById('card-validade').addEventListener('input', function(e){
  if (e.target && e.target.id === 'vl-validade') e.target.value = maskDataBR(e.target.value);
  else if (e.target && e.target.id === 'vl-qtd') e.target.value = e.target.value.replace(/\D/g, '');
});

/* ---------------- NUTRICIONISTA: agendamentos e repasse ---------------- */
function agendamentosDoMes(pacId, ym){
  return AGEND.filter(function(a){ return a.paciente_id === pacId && String(a.data).slice(0,7) === ym && a.status !== 'cancelado' && a.status !== 'recusou'; });
}
function proximoAgendamento(pacId){
  var hoje = todayISO();
  return AGEND.filter(function(a){ return a.paciente_id === pacId && a.data >= hoje && a.status !== 'cancelado' && a.status !== 'recusou'; })
    .sort(function(a,b){ return (a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')); })[0] || null;
}
function repasseDoMes(nutri, ym){
  return PACIENTES.filter(function(p){ return p.nutricionista === nutri && p.ativo !== false && TIPOS_REPASSE.indexOf(p.tipo) > -1; })
    .map(function(p){ return { p: p, ags: agendamentosDoMes(p.id, ym).filter(function(a){ return a.status === 'realizado'; }) }; })
    .filter(function(x){ return x.ags.length > 0; });
}

/* ---------------- NUTRICIONISTA: render ---------------- */
function renderRepasse(){
  var box = document.getElementById('card-repasse');
  var nome = nutriSel === 'mario' ? 'Dr. Mário' : 'Dra. Tomázia';
  var lista = repasseDoMes(nutriSel, nutriMesSel);
  var h = '<h3>Repasse devido — ' + nome + '</h3>';
  h += '<div class="cardsub">Pacientes Plano 1 / Consulta 1 com consulta já realizada em ' + mesLabel(nutriMesSel) + ' — é quando a academia repassa ao nutricionista.</div>';
  if (!lista.length){
    h += '<div class="vazio">Nenhum repasse devido neste mês ainda.</div>';
  } else {
    lista.forEach(function(x){
      h += '<div class="row"><span class="rowtxt"><b>' + esc(x.p.nome) + '</b> <span class="muted">· ' + tipoLabel(x.p.tipo) + '</span></span>'
         + '<span class="tag ok">' + x.ags.length + ' realizada' + (x.ags.length > 1 ? 's' : '') + '</span></div>';
    });
  }
  box.innerHTML = h;
}

function naoAgendouStatus(pacId, ym){
  return AGEND.some(function(a){ return a.paciente_id === pacId && a.status === 'recusou' && String(a.data).slice(0,7) === ym; });
}
function formAgendarHtml(p, naoAgendouAtual, ym){
  var doMes = AGEND.filter(function(a){ return a.paciente_id === p.id && a.status !== 'recusou' && String(a.data).slice(0,7) === ym; })
    .sort(function(a,b){ return (a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')); });
  var h = '';
  h += '<div class="field"><label>Tipo neste ciclo</label><select class="mini-sel" data-tipo-paciente="' + p.id + '">'
    + TIPOS.map(function(t){ return '<option value="'+t[0]+'"'+(p.tipo===t[0]?' selected':'')+'>'+t[1]+'</option>'; }).join('')
    + '</select></div>';
  if (doMes.length){
    h += '<div class="rowsub">Agendamentos do mês</div>';
    doMes.forEach(function(a){
      h += '<div class="row"><span class="rowtxt">' + fmtDataHora(a.data, a.hora) + '</span>'
         + '<span class="acoes"><select class="mini-sel" data-status-agenda="' + a.id + '">'
         + ['agendado','realizado','faltou','cancelado'].map(function(s){ return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+s+'</option>'; }).join('')
         + '</select> <button class="mini danger" data-del-agenda="' + a.id + '">excluir</button></span></div>';
    });
    // Já tem agendamento este mês: só edita o que existe, sem abrir campo de novo agendamento.
    h += '<div class="acoes" style="margin-top:10px"><button class="btn-outline" data-nao-agendou="' + p.id + '">' + (naoAgendouAtual ? 'Desmarcar "não agendou"' : 'Não quis agendar este mês') + '</button></div>';
  } else {
    h += '<div class="field"><label>Data</label><input type="date" id="ag-data-' + p.id + '" value=""></div>'
      + '<div class="field"><label>Hora</label><input type="time" id="ag-hora-' + p.id + '"></div>'
      + '<div class="acoes"><button class="btn" data-salvar-agenda="' + p.id + '">Salvar agendamento</button>'
      + '<button class="btn-outline" data-nao-agendou="' + p.id + '">' + (naoAgendouAtual ? 'Desmarcar "não agendou"' : 'Não quis agendar este mês') + '</button></div>';
  }
  return h;
}
function formEditarHtml(p){
  return '<div class="field"><label>Nome</label><input class="inp" id="ed-nome-' + p.id + '" value="' + escAttr(p.nome) + '"></div>'
    + '<div class="field"><label>Telefone</label><input class="inp" id="ed-tel-' + p.id + '" value="' + escAttr(p.telefone||'') + '"></div>'
    + '<label class="chk"><input type="checkbox" id="ed-ativo-' + p.id + '"' + (p.ativo !== false ? ' checked' : '') + '> Ativo</label>'
    + '<div class="acoes"><button class="btn" data-salvar-paciente="' + p.id + '">Salvar</button>'
    + '<button class="btn-outline danger" data-arquivar-paciente="' + p.id + '">' + (p.ativo !== false ? 'Arquivar' : 'Reativar') + '</button></div>';
}

/* ---------------- NUTRICIONISTA: agenda visual do mês ---------------- */
var PARTICULAS_NOME = ['de', 'da', 'do', 'dos', 'das'];
// Nome + primeiro sobrenome, cortando sobrenomes extras — pra caber no bloco do dia.
function nomeCurto(nomeCompleto){
  var partes = String(nomeCompleto || '').trim().split(/\s+/);
  if (partes.length <= 2) return partes.join(' ');
  var fim = (PARTICULAS_NOME.indexOf(partes[1].toLowerCase()) > -1) ? 3 : 2;
  return partes.slice(0, fim).join(' ');
}
function renderAgendaMes(){
  var box = document.getElementById('card-agenda-mes');
  var nutriNomeFull = nutriSel === 'mario' ? 'Dr. Mário' : 'Dra. Tomázia';
  var pacientesNutri = PACIENTES.filter(function(p){ return p.nutricionista === nutriSel && p.ativo !== false; })
    .map(function(p){ return { p: p, off: naoAgendouStatus(p.id, nutriMesSel) }; });
  var agsDoMes = AGEND.filter(function(a){ return String(a.data).slice(0,7) === nutriMesSel && a.status !== 'cancelado' && a.status !== 'recusou'; });
  var arquivados = PACIENTES.filter(function(p){ return p.nutricionista === nutriSel && p.ativo === false; })
    .sort(function(a,b){ return a.nome.localeCompare(b.nome); });

  var h = '<div class="cardhead"><h3>Agenda do mês</h3><span class="muted" style="font-size:12px">' + mesLabel(nutriMesSel) + '</span></div>';
  if (!pacientesNutri.length){
    h += '<div class="vazio">Nenhum paciente ativo cadastrado ainda.</div>';
  } else {
    // Assim que o paciente tem um agendamento no mês, ele sobe pro card "Agendado";
    // os demais ficam em "Sem agendamento".
    var agendadosPorPac = {}, semAgenda = [];
    pacientesNutri.forEach(function(item){
      var ags = agsDoMes.filter(function(a){ return a.paciente_id === item.p.id; });
      if (ags.length) agendadosPorPac[item.p.id] = { p: item.p, off: item.off, total: ags.length };
      else semAgenda.push(item);
    });
    semAgenda.sort(function(a,b){ return (a.off === b.off) ? a.p.nome.localeCompare(b.p.nome) : (a.off ? 1 : -1); });

    // Card "Agendado": uma linha por agendamento (não por paciente), agrupada por
    // dia exato — um bloco por dia, lado a lado — e ordenada por data, hora e nome.
    var ocorrencias = agsDoMes.filter(function(a){ return !!agendadosPorPac[a.paciente_id]; }).map(function(a){
      var info = agendadosPorPac[a.paciente_id];
      return { a: a, p: info.p, off: info.off, total: info.total };
    }).sort(function(x,y){
      return x.a.data.localeCompare(y.a.data) || (x.a.hora || '').localeCompare(y.a.hora || '') || x.p.nome.localeCompare(y.p.nome);
    });

    h += '<div class="subcard"><div class="subcard-h">Agendado <span class="muted">(' + Object.keys(agendadosPorPac).length + ')</span></div>';
    if (!ocorrencias.length){
      h += '<div class="vazio">Nenhum paciente agendado ainda neste mês.</div>';
    } else {
      var vistos = {}, porDia = {}, ordemDias = [];
      ocorrencias.forEach(function(o){
        if (!porDia[o.a.data]){ porDia[o.a.data] = []; ordemDias.push(o.a.data); }
        porDia[o.a.data].push(o);
      });
      h += '<div class="dias-linha">';
      ordemDias.forEach(function(dia){
        h += '<div class="dia-bloco"><div class="dia-bloco-h">Dia ' + fmtDataBR(dia).slice(0,5) + '</div>';
        porDia[dia].forEach(function(o){
          var p = o.p, a = o.a;
          vistos[p.id] = (vistos[p.id] || 0) + 1;
          var horaTxt = a.hora ? String(a.hora).slice(0,5) : '--:--';
          var wa = p.telefone ? waLink(p.telefone, msgConfirmacaoNutri(p, a, nutriNomeFull)) : null;
          h += '<div class="dia-linha">'
            + '<button class="icon-link" data-toggle="agendar" data-pac="' + p.id + '" title="Editar agenda">📅</button>'
            + '<button class="icon-link" data-toggle="editar" data-pac="' + p.id + '" title="Editar">✏️</button> '
            + '<b>' + horaTxt + '</b> - ' + esc(nomeCurto(p.nome))
            + (wa ? ' <a class="icon-link wa" href="' + wa + '" target="_blank" rel="noopener" title="Confirmar WhatsApp">💬</a>' : '')
            + '</div>';
          if (vistos[p.id] === o.total){
            var ex = pacExpand[p.id] || {};
            if (ex.agendar) h += '<div class="subform">' + formAgendarHtml(p, o.off, nutriMesSel) + '</div>';
            if (ex.editar) h += '<div class="subform">' + formEditarHtml(p) + '</div>';
          }
        });
        h += '</div>';
      });
      h += '</div>';
    }
    h += '</div>';

    h += '<div class="acoes" style="margin:0 0 12px"><button class="btn-outline" id="btn-copiar-agenda">Copiar agenda</button><span class="msg" id="copiar-agenda-msg"></span></div>';

    h += '<div class="subcard"><div class="subcard-h">Sem agendamento <span class="muted">(' + semAgenda.length + ')</span></div>';
    if (!semAgenda.length){
      h += '<div class="vazio">Todo mundo já tem agendamento neste mês.</div>';
    } else {
      semAgenda.forEach(function(item){
        var p = item.p, ex = pacExpand[p.id] || {};
        h += '<div class="row"><span class="rowtxt">'
          + '<button class="icon-link" data-toggle="agendar" data-pac="' + p.id + '" title="Agendar">📅</button>'
          + '<button class="icon-link" data-toggle="editar" data-pac="' + p.id + '" title="Editar">✏️</button> '
          + esc(p.nome) + '</span></div>';
        if (ex.agendar) h += '<div class="subform">' + formAgendarHtml(p, item.off, nutriMesSel) + '</div>';
        if (ex.editar) h += '<div class="subform">' + formEditarHtml(p) + '</div>';
      });
    }
    h += '</div>';
  }

  if (arquivados.length){
    var exA = !!pacExpand.__arquivados;
    h += '<div class="acoes" style="margin-top:10px"><button class="mini" id="toggle-arquivados">' + (exA ? '▾' : '▸') + ' Arquivados (' + arquivados.length + ')</button></div>';
    if (exA){
      arquivados.forEach(function(p){
        h += '<div class="row"><span class="rowtxt">' + esc(p.nome) + '</span>'
           + '<button class="mini" data-arquivar-paciente="' + p.id + '">Reativar</button></div>';
      });
    }
  }

  box.innerHTML = h;
}

function textoAgendaMes(){
  var pacientesNutri = PACIENTES.filter(function(p){ return p.nutricionista === nutriSel && p.ativo !== false; });
  var porId = {};
  pacientesNutri.forEach(function(p){ porId[p.id] = p; });
  var hoje = todayISO();
  var ags = AGEND.filter(function(a){
    return String(a.data).slice(0,7) === nutriMesSel && String(a.data).slice(0,10) >= hoje && a.status !== 'cancelado' && a.status !== 'recusou' && porId[a.paciente_id];
  }).sort(function(a,b){ return (a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')); });
  if (!ags.length) return '';
  var porDia = {};
  ags.forEach(function(a){ (porDia[a.data] = porDia[a.data] || []).push(a); });
  var dias = Object.keys(porDia).sort();
  var blocos = dias.map(function(d){
    var linhas = porDia[d].map(function(a){
      var p = porId[a.paciente_id];
      return '*' + (a.hora ? String(a.hora).slice(0,5) : 'sem horário') + '* - ' + p.nome;
    });
    return '*Dia ' + fmtDataBR(d).slice(0,5) + '*\n' + linhas.join('\n');
  });
  return blocos.join('\n\n');
}

async function copiarAgenda(){
  var msgEl = document.getElementById('copiar-agenda-msg');
  var texto = textoAgendaMes();
  if (!texto){ if (msgEl) msgEl.textContent = 'Nenhum agendamento neste mês.'; return; }
  try{
    await navigator.clipboard.writeText(texto);
    if (msgEl) msgEl.textContent = 'Agenda copiada!';
  }catch(e){
    if (msgEl) msgEl.textContent = 'Não consegui copiar — tenta de novo.';
  }
  setTimeout(function(){ if (msgEl) msgEl.textContent = ''; }, 3000);
}

async function onPacienteAreaClick(e){
  if (e.target && e.target.id === 'toggle-arquivados'){
    pacExpand.__arquivados = !pacExpand.__arquivados;
    renderAgendaMes();
    return;
  }
  if (e.target && e.target.id === 'btn-copiar-agenda'){
    copiarAgenda();
    return;
  }
  var t = e.target.closest ? e.target.closest('[data-toggle],[data-salvar-agenda],[data-del-agenda],[data-salvar-paciente],[data-arquivar-paciente],[data-nao-agendou]') : null;
  if (!t) return;
  var v;
  if (v = t.getAttribute('data-toggle')){
    var pacId = t.getAttribute('data-pac');
    pacExpand[pacId] = pacExpand[pacId] || {};
    pacExpand[pacId][v] = !pacExpand[pacId][v];
    renderAgendaMes();
    return;
  }
  if (v = t.getAttribute('data-salvar-agenda')){
    var dEl = document.getElementById('ag-data-' + v), hEl = document.getElementById('ag-hora-' + v);
    if (!dEl.value){ alert('Escolha a data do novo agendamento antes de salvar.'); return; }
    t.disabled = true;
    var novo = { id: uid(), paciente_id: v, data: dEl.value, hora: hEl.value || null, status: 'agendado' };
    var r = await sb.from('nutri_agendamentos').insert(novo).select().single();
    t.disabled = false;
    if (r.error){
      console.error('Erro ao salvar agendamento:', r.error);
      alert('Não consegui salvar o agendamento: ' + (r.error.message || r.error.code || 'motivo desconhecido'));
      return;
    }
    AGEND.push(r.data);
    pacExpand[v].agendar = false;
    renderRepasse(); renderAgendaMes();
    return;
  }
  if (v = t.getAttribute('data-nao-agendou')){
    var jaTem = naoAgendouStatus(v, nutriMesSel);
    t.disabled = true;
    if (jaTem){
      var alvo = AGEND.filter(function(a){ return a.paciente_id === v && a.status === 'recusou' && String(a.data).slice(0,7) === nutriMesSel; });
      for (var i = 0; i < alvo.length; i++){ await sb.from('nutri_agendamentos').delete().eq('id', alvo[i].id); }
      AGEND = AGEND.filter(function(a){ return !(a.paciente_id === v && a.status === 'recusou' && String(a.data).slice(0,7) === nutriMesSel); });
    } else {
      var flag = { id: uid(), paciente_id: v, data: nutriMesSel + '-01', hora: null, status: 'recusou' };
      var rn = await sb.from('nutri_agendamentos').insert(flag).select().single();
      if (!rn.error) AGEND.push(rn.data);
    }
    t.disabled = false;
    renderRepasse(); renderAgendaMes();
    return;
  }
  if (v = t.getAttribute('data-del-agenda')){
    if (!confirm('Excluir este agendamento?')) return;
    await sb.from('nutri_agendamentos').delete().eq('id', v);
    AGEND = AGEND.filter(function(a){ return a.id !== v; });
    renderRepasse(); renderAgendaMes();
    return;
  }
  if (v = t.getAttribute('data-salvar-paciente')){
    var nome = document.getElementById('ed-nome-' + v).value.trim();
    if (!nome) return;
    var tel = document.getElementById('ed-tel-' + v).value.trim();
    var ativo = document.getElementById('ed-ativo-' + v).checked;
    t.disabled = true;
    var patch = { nome: nome, telefone: tel || null, ativo: ativo };
    var r = await sb.from('nutri_pacientes').update(patch).eq('id', v);
    t.disabled = false;
    if (r.error){ alert('Não consegui salvar.'); return; }
    var p = PACIENTES.filter(function(x){ return x.id === v; })[0];
    if (p) Object.assign(p, patch);
    pacExpand[v].editar = false;
    renderRepasse(); renderAgendaMes();
    return;
  }
  if (v = t.getAttribute('data-arquivar-paciente')){
    var p2 = PACIENTES.filter(function(x){ return x.id === v; })[0];
    if (!p2) return;
    var novoAtivo = !(p2.ativo !== false);
    await sb.from('nutri_pacientes').update({ ativo: novoAtivo }).eq('id', v);
    p2.ativo = novoAtivo;
    renderAgendaMes();
    return;
  }
}
document.getElementById('card-agenda-mes').addEventListener('click', onPacienteAreaClick);
document.getElementById('card-agenda-mes').addEventListener('change', async function(e){
  var pacId = e.target.getAttribute('data-tipo-paciente');
  if (pacId){
    var novoTipo = e.target.value;
    var r = await sb.from('nutri_pacientes').update({ tipo: novoTipo }).eq('id', pacId);
    if (r.error){ console.error('Erro ao salvar tipo:', r.error); alert('Não consegui salvar o tipo: ' + (r.error.message || r.error.code || 'motivo desconhecido')); return; }
    var p = PACIENTES.filter(function(x){ return x.id === pacId; })[0];
    if (p) p.tipo = novoTipo;
    renderRepasse();
    renderAgendaMes();
    return;
  }
  var id = e.target.getAttribute('data-status-agenda');
  if (!id) return;
  var novoStatus = e.target.value;
  var a = AGEND.filter(function(x){ return x.id === id; })[0];
  var statusAnterior = a ? a.status : null;
  await sb.from('nutri_agendamentos').update({ status: novoStatus }).eq('id', id);
  if (a) a.status = novoStatus;
  // Consulta virou "realizado": já sugere o tipo do próximo ciclo (alterna
  // Plano 1↔2, Consulta 1↔2), sem travar — dá pra corrigir na mão depois.
  if (a && novoStatus === 'realizado' && statusAnterior !== 'realizado'){
    var p = PACIENTES.filter(function(x){ return x.id === a.paciente_id; })[0];
    var proximo = p ? proximoTipo(p.tipo) : null;
    if (p && proximo){
      var rTipo = await sb.from('nutri_pacientes').update({ tipo: proximo }).eq('id', p.id);
      if (!rTipo.error) p.tipo = proximo;
    }
  }
  renderRepasse();
  renderAgendaMes();
});

/* ---------------- VISITANTES: regras ---------------- */
function jaFezExperimentalNoMes(nome, telefone, ym){
  var nn = normaliza(nome), td = digits(telefone);
  return VISIT.filter(function(v){
    if (v.tipo !== 'experimental' || String(v.data).slice(0,7) !== ym) return false;
    if (td && digits(v.telefone) === td) return true;
    if (!td && normaliza(v.nome) === nn) return true;
    return false;
  });
}
function convidadosDoAlunoNoMes(alunoNome, ym){
  var na = normaliza(alunoNome);
  return VISIT.filter(function(v){ return v.tipo === 'convidado' && normaliza(v.aluno_convite) === na && String(v.data).slice(0,7) === ym; });
}
function alunosConhecidos(){
  var set = {};
  VISIT.forEach(function(v){ if (v.aluno_convite) set[v.aluno_convite] = 1; });
  return Object.keys(set).sort();
}

/* ---------------- VISITANTES: render ---------------- */
function atualizarResumoVisitantes(todosDoMes){
  todosDoMes = todosDoMes || VISIT.filter(function(v){ return v.tipo === visitTipoSel && String(v.data).slice(0,7) === visitMesSel; });
  var comMsg = todosDoMes.filter(function(v){ return v.mensagem_enviada; }).length;
  var viraramAluno = todosDoMes.filter(function(v){ return v.virou_aluno; }).length;
  document.getElementById('visit-resumo').textContent =
    todosDoMes.length + (todosDoMes.length === 1 ? ' cadastro' : ' cadastros') + ' em ' + mesLabel(visitMesSel)
    + ' · ' + comMsg + ' com mensagem enviada'
    + ' · ' + viraramAluno + ' virou' + (viraramAluno === 1 ? '' : 'aram') + ' aluno';
}
function renderVisitantes(){
  var box = document.getElementById('lista-visitantes');
  var busca = normaliza(document.getElementById('visit-busca').value);
  var todosDoMes = VISIT.filter(function(v){ return v.tipo === visitTipoSel && String(v.data).slice(0,7) === visitMesSel; });
  var lista = todosDoMes.filter(function(v){ return !busca || normaliza(v.nome).indexOf(busca) > -1; })
    .sort(function(a,b){ return String(b.data).localeCompare(String(a.data)); });

  document.getElementById('visit-titulo').textContent = visitTipoSel === 'experimental' ? 'Nova aula experimental' : 'Novo convidado';

  atualizarResumoVisitantes(todosDoMes);

  if (!lista.length){ box.innerHTML = '<div class="vazio">Nenhum cadastro em ' + mesLabel(visitMesSel) + '.</div>'; return; }

  function linhaHtml(v, ocultarAlunoConvite){
    var wa = waLink(v.telefone, visitTipoSel === 'experimental' ? msgExperimental(v.nome) : msgConvidado(v.nome, v.aluno_convite));
    var h = '<div class="row visit-row">';
    h += '<span class="rowtxt"><b>' + fmtDataBR(v.data) + '</b> <span class="muted">·</span> ' + esc(v.nome) + (v.aluno_convite && !ocultarAlunoConvite ? '<span class="muted"> · trazido por ' + esc(v.aluno_convite) + '</span>' : '')
       + (v.telefone ? '<br><span class="muted">' + esc(v.telefone) + '</span>' : '') + '</span>';
    h += '<span class="acoes">';
    h += '<label class="mini-chk"><input type="checkbox" data-msg-enviada="' + v.id + '"' + (v.mensagem_enviada ? ' checked' : '') + '> msg enviada</label>';
    h += '<label class="mini-chk"><input type="checkbox" data-virou-aluno="' + v.id + '"' + (v.virou_aluno ? ' checked' : '') + '> virou aluno</label>';
    if (wa) h += '<a class="mini wa" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>';
    h += '</span></div>';
    return h;
  }

  var h = '';
  if (visitTipoSel === 'experimental'){
    var porAtividade = {};
    lista.forEach(function(v){ var k = v.atividade || 'Outros'; (porAtividade[k] = porAtividade[k] || []).push(v); });
    Object.keys(porAtividade).sort().forEach(function(k){
      h += '<div class="subcard"><div class="subcard-h">' + esc(k) + ' <span class="muted">(' + porAtividade[k].length + ')</span></div>';
      h += porAtividade[k].map(function(v){ return linhaHtml(v, false); }).join('');
      h += '</div>';
    });
  } else {
    var porAluno = {};
    lista.forEach(function(v){ var k = v.aluno_convite || 'Sem aluno informado'; (porAluno[k] = porAluno[k] || []).push(v); });
    Object.keys(porAluno).sort().forEach(function(k){
      h += '<div class="subcard"><div class="subcard-h">' + esc(k) + ' <span class="muted">(' + porAluno[k].length + ')</span></div>';
      h += porAluno[k].map(function(v){ return linhaHtml(v, true); }).join('');
      h += '</div>';
    });
  }
  box.innerHTML = h;
}

document.getElementById('btn-novo-visitante').addEventListener('click', function(){
  var box = document.getElementById('form-novo-visitante');
  box.hidden = !box.hidden;
  if (box.hidden) return;

  var camposExtra = visitTipoSel === 'experimental'
    ? '<div class="field"><label>Aula / atividade</label><input class="inp" id="nv-ativ" list="ativ-list" placeholder="Musculação, Muay Thai...">'
      + '<datalist id="ativ-list"><option value="Musculação"><option value="Muay Thai"><option value="Dança"><option value="Funcional"></datalist></div>'
    : '<div class="field"><label>Aluno que convidou</label><input class="inp" id="nv-aluno" list="aluno-list" placeholder="Nome do aluno">'
      + '<datalist id="aluno-list">' + alunosConhecidos().map(function(n){ return '<option value="' + escAttr(n) + '">'; }).join('') + '</datalist></div>';

  box.innerHTML =
      '<div class="field"><label>Data</label><input type="date" id="nv-data" value="' + todayISO() + '"></div>'
    + camposExtra
    + '<div class="field"><label>Nome</label><input class="inp" id="nv-nome"></div>'
    + '<div class="field"><label>Telefone</label><input class="inp" id="nv-tel" placeholder="(xx) 9xxxx-xxxx"></div>'
    + '<div class="aviso" id="nv-aviso" hidden></div>'
    + '<button class="btn" id="nv-salvar">Cadastrar</button><span class="msg" id="nv-msg"></span>';

  var confirmarOverride = false;
  document.getElementById('nv-salvar').addEventListener('click', async function(){
    var btn = this;
    var data = document.getElementById('nv-data').value;
    var nome = document.getElementById('nv-nome').value.trim();
    var tel = document.getElementById('nv-tel').value.trim();
    if (!data || !nome) return;
    var ym = data.slice(0,7);
    var avisoBox = document.getElementById('nv-aviso');

    if (visitTipoSel === 'experimental'){
      var dup = jaFezExperimentalNoMes(nome, tel, ym);
      if (dup.length && !confirmarOverride){
        avisoBox.hidden = false;
        avisoBox.textContent = '⚠ ' + nome + ' já fez aula experimental em ' + fmtDataBR(dup[0].data) + ' esse mês. Clique em Cadastrar de novo para confirmar mesmo assim.';
        confirmarOverride = true;
        return;
      }
    } else {
      var alunoEl = document.getElementById('nv-aluno');
      var alunoNome = alunoEl.value.trim();
      if (!alunoNome){ document.getElementById('nv-msg').textContent = 'Informe o nome do aluno que convidou.'; return; }
      var jaTem = convidadosDoAlunoNoMes(alunoNome, ym);
      if (jaTem.length >= 2 && !confirmarOverride){
        avisoBox.hidden = false;
        avisoBox.textContent = '⚠ ' + alunoNome + ' já trouxe ' + jaTem.length + ' convidado(s) em ' + mesLabel(ym) + ' (limite é 2): ' + jaTem.map(function(x){ return x.nome; }).join(', ') + '. Clique em Cadastrar de novo para confirmar mesmo assim.';
        confirmarOverride = true;
        return;
      }
    }

    btn.disabled = true;
    var novo = {
      id: uid(), tipo: visitTipoSel, data: data, nome: nome, telefone: tel || null,
      atividade: visitTipoSel === 'experimental' ? (document.getElementById('nv-ativ').value.trim() || null) : null,
      aluno_convite: visitTipoSel === 'convidado' ? document.getElementById('nv-aluno').value.trim() : null,
      mensagem_enviada: false
    };
    var r = await sb.from('visitantes').insert(novo).select().single();
    btn.disabled = false;
    if (r.error){
      console.error('Erro ao salvar visitante:', r.error);
      document.getElementById('nv-msg').textContent = 'Erro ao salvar: ' + (r.error.message || r.error.code || 'motivo desconhecido');
      return;
    }
    VISIT.push(r.data);
    box.hidden = true;
    renderVisitantes();
  });
});

(async function init(){
  popularMeses(document.getElementById('nutri-mes'), nutriMesSel, function(v){ nutriMesSel = v; renderRepasse(); renderAgendaMes(); });
  popularMeses(document.getElementById('visit-mes'), visitMesSel, function(v){ visitMesSel = v; renderVisitantes(); });
  try{
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) bootApp(); else mostrarLogin('');
  }catch(e){ mostrarLogin(''); }
})();
